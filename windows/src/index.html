<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>imd</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="preview/preview.css">
</head>
<body>
<div id="tabbar"></div>
<div id="main">
  <div id="toc"></div>
  <div id="right">
    <div id="header">
      <button id="tocBtn" title="TOC"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1.4" y="2.2" width="13.2" height="11.6" rx="2.4"/><line x1="5.8" y1="2.2" x2="5.8" y2="13.8"/><line x1="3" y1="5.6" x2="4.4" y2="5.6"/><line x1="3" y1="8" x2="4.4" y2="8"/><line x1="3" y1="10.4" x2="4.4" y2="10.4"/></svg></button>
      <div id="seg">
        <button id="segPreview" data-i18n="preview" class="sel"></button>
        <button id="segSource" data-i18n="source"></button>
      </div>
    </div>
    <div id="searchbar">
      <input id="searchInput" data-i18n-ph="searchPlaceholder">
      <span id="searchCount"></span>
      <button id="prevBtn" data-i18n="prevMatch">↑</button>
      <button id="nextBtn" data-i18n="nextMatch">↓</button>
      <input id="replaceInput" data-i18n-ph="replacePlaceholder">
      <button id="replaceBtn" data-i18n="replace"></button>
      <button id="replaceAllBtn" data-i18n="replaceAll"></button>
      <button id="caseBtn" data-i18n="matchCase">Aa</button>
      <button id="searchClose">✕</button>
    </div>
    <div id="previewPane"><div id="content"></div></div>
    <textarea id="sourcePane" spellcheck="false" wrap="off"></textarea>
  </div>
</div>
<script src="preview/marked.min.js"></script>
<script src="preview/preview.js"></script>
<script src="app.js"></script>
</body>
</html>
